# Enable True Color (24-bit RGB) for Neovim themes
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "screen-256color"

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# Switch windows with Alt+h and Alt+l (No Prefix)
bind -n M-h previous-window
bind -n M-l next-window

#Scratchpad and documentation
bind -n M-n display-popup -w 80% -h 80% -E "nvim + ~/scratchpad.md"
bind -n M-v display-popup -w 80% -h 80% -E "nvim + ~/vault ."

# Claude Code floating session, one persistent session per project dir:
# scoped to whatever directory the pane was in when you pressed Alt+C.
# Toggling only attaches/detaches (never restarts), so each project's
# conversation stays alive between opens.
bind -n M-c if-shell -F '#{m:claude-*,#{session_name}}' \
  'detach-client' \
  'display-popup -w 85% -h 85% -E "~/.local/scripts/tmux-claude-popup #{pane_current_path}"'

# Session picker: browse all sessions, press x on one to kill it (no prefix)
bind -n M-s choose-tree -Zs

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

